<script type="text/x-dc" data-dc-script data-props='{"actief":{"editor":"enum","options":["weekplanning","scania","overzicht","stamgegevens"],"default":"weekplanning"},"profielmenu":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: null }; }
  renderVals() {
    var self = this, a = this.props.actief || 'weekplanning';
    var open = this.state.menu !== null ? this.state.menu : !!this.props.profielmenu;
    function item(k) { var on = a === k; return { cur: on ? 'page' : 'false', fw: on ? '700' : '600', bg: on ? '#ffed00' : 'transparent' }; }
    return {
      w: item('weekplanning'), s: item('scania'), o: item('overzicht'), g: item('stamgegevens'),
      open: open, hdrZ: open ? '30' : 'auto', btnBg: open ? '#f7f7f6' : 'transparent', chev: open ? 'rotate(180deg)' : 'none',
      toggle: function () { self.setState({ menu: !open }); }
    };
  }
}
</script>
